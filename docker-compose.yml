version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placementconnect-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://placement_user:placement_secret@db:5432/placementconnect?schema=public
      - AUTH_SECRET=production-grade-auth-secret-replace-in-env
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: placementconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: placement_secret
      POSTGRES_DB: placementconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placementconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
