name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: placementconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Run Programmatic Test Suite (Vitest)
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
          AUTH_SECRET: "ci-testing-auth-secret-super-long-32-chars-min"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/placementconnect_test?schema=public"
          AUTH_SECRET: "ci-testing-auth-secret-super-long-32-chars-min"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
